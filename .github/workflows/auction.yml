name: auction-record
on:
  schedule:
    # 北京时间 09:26 触发，GitHub Actions是UTC时间，需要减8小时 => 01:26
    - cron: '26 01 * * 1-5'
  workflow_dispatch: # 支持手动点击测试

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas

      - name: 执行采集脚本
        run: python auction.py

      - name: 提交csv文件到仓库
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add auction_data.csv
          git commit -m "auto update auction data" || echo "无新数据，无需提交"
          git push
